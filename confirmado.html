<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta confirmada | Enraíza</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #ffffff;
      --ink: #213128;
      --muted: #53675d;
      --line: #dfe6dc;
      --moss: #2d5b3a;
      --moss-dark: #1f3f2b;
      --moss-soft: #eaf2ea;
      --green: #3f6b4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f9f6f1 0%, #eef4ee 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
    }
    .card {
      width: min(92vw, 620px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(21, 38, 29, 0.08);
    }
    .header {
      background: linear-gradient(135deg, var(--moss) 0%, #4a7a52 100%);
      padding: 30px 24px;
      text-align: center;
    }
    .logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      color: #f8f5f0;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .content {
      padding: 28px 24px 24px;
      text-align: center;
    }
    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--moss-soft);
      color: var(--green);
      font-size: 2.2rem;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.2;
      color: var(--ink);
    }
    p {
      margin: 0 auto 20px;
      max-width: 44ch;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
    }
    .cta {
      display: inline-block;
      background: var(--moss);
      color: #fff;
      text-decoration: none;
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.98rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .cta:hover {
      transform: translateY(-1px);
      opacity: 0.98;
    }
    .footer {
      padding: 0 24px 24px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <p class="logo">Enraíza</p>
    </div>
    <div class="content">
      <div class="check">✓</div>
      <h1>Tu cuenta ya está activa</h1>
      <p>
        La confirmación fue exitosa. Ya puedes entrar a Enraíza y empezar a explorar la comunidad, compartir ideas y cuidar lo que crece a tu alrededor.
      </p>
      <a class="cta" href="index.html">Ir a Enraíza</a>
    </div>
    <div class="footer">
      Por una vida más sostenible, una raíz a la vez.
    </div>
  </div>
</body>
</html>
